[versions]
# --- Build toolchain -------------------------------------------------------
# Held at 9.0.0: that is the newest AGP the installed Android Studio
# (2025.3.1) will open a project with. Raise it only alongside the IDE.
agp = "9.0.0"
# AGP 9 ships its own Kotlin. This pins the compiler-plugin versions
# (Compose, serialization) and the KGP that AGP resolves against.
kotlin = "2.3.21"
# KSP generates the Room DAOs. Its version tracks the Kotlin compiler it runs
# against, so the two move together.
ksp = "2.3.11"

# --- SDK levels ------------------------------------------------------------
# Compose 1.11 (BOM 2026.06.01) only needs API 35; 36 is what the installed
# build-tools and the AGP 9.0 line are built around.
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# --- AndroidX / Compose ----------------------------------------------------
# Last BOM before Compose 1.12, which hard-requires AGP 9.1+.
composeBom = "2026.06.01"
coreKtx = "1.17.0"
activityCompose = "1.13.0"
# 2.11.0 hard-requires AGP 9.1+.
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
# 1.3.0 hard-requires AGP 9.1+ and compileSdk 37.
adaptive = "1.2.0"
splashscreen = "1.0.1"
webkit = "1.17.0"

# --- Data ------------------------------------------------------------------
# Room backs attempt history and the analytics built on it: the questions are
# "how has my score moved" and "which topics cost me marks", and those are
# queries, not a document to load whole.
room = "2.8.4"
datastore = "1.2.1"
serialization = "1.11.0"
coroutines = "1.11.0"
desugarJdkLibs = "2.1.5"

# --- Media / documents -----------------------------------------------------
coil = "3.5.0"
# Google's first-party PDF viewer. Still alpha, so it is wrapped behind our own
# PdfViewer composable to keep the swap cost to a single file.
androidxPdf = "1.0.0-alpha19"

# --- Server ----------------------------------------------------------------
# The sync API is Ktor on the JVM: same language and the same kotlinx
# serialization as the app, so the wire models are written once.
ktor = "3.5.2"
# Migrations are versioned SQL under server/src/main/resources/db/migration.
flyway = "13.4.0"
hikari = "7.1.0"
postgresql = "42.7.13"
# Tests run against H2 in PostgreSQL compatibility mode, so the suite needs no
# Docker and no running database. See server/README.md for what that costs.
h2 = "2.4.240"
bcrypt = "0.10.2"
logback = "1.6.3"

# --- Test ------------------------------------------------------------------
junit = "4.13.2"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
turbine = "1.2.1"
mockk = "1.14.7"
# Runs the Room DAO tests on the JVM, so the SQL is covered by the same suite
# as everything else rather than needing an emulator.
robolectric = "4.16.1"

[libraries]
# Compose (versions come from the BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "adaptive" }
compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive" }

# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Data
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Media / documents
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
androidx-pdf-compose = { group = "androidx.pdf", name = "pdf-compose", version.ref = "androidxPdf" }

# Server
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { group = "io.ktor", name = "ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { group = "io.ktor", name = "ktor-server-call-logging", version.ref = "ktor" }
ktor-server-default-headers = { group = "io.ktor", name = "ktor-server-default-headers", version.ref = "ktor" }
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }
ktor-server-rate-limit = { group = "io.ktor", name = "ktor-server-rate-limit", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
h2 = { group = "com.h2database", name = "h2", version.ref = "h2" }
bcrypt = { group = "at.favre.lib", name = "bcrypt", version.ref = "bcrypt" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# The server is a plain JVM module, so it applies KGP directly. The :app module
# must not -- AGP 9 has built-in Kotlin and rejects the Android variant.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
