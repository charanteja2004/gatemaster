<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Answering</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .question-container {
            margin-bottom: 30px;
        }
        .question {
            font-size: 20px;
            margin-bottom: 15px;
        }
        .option {
            margin-bottom: 10px;
        }
        .option input {
            margin-right: 10px;
        }
        .option label {
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
        .correct-answer {
            background-color: #d4edda;
            color: #155724;
            padding: 5px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
    </style>

    <link rel="stylesheet" href="../reader.css" data-gatemaster-reader="1">
</head>
<body>
    <div class="container">
        <form id="mcqForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>

    <script>
        async function loadQuestions() {
            const response = await fetch('file:///android_asset/questions.json');
            const questions = await response.json();
            const form = document.getElementById('mcqForm');

            questions.forEach((q, index) => {
                const questionContainer = document.createElement('div');
                questionContainer.className = 'question-container';

                const questionText = document.createElement('div');
                questionText.className = 'question';
                questionText.textContent = q.question;
                questionContainer.appendChild(questionText);

                q.options.forEach((option, optionIndex) => {
                    const optionContainer = document.createElement('div');
                    optionContainer.className = 'option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q${index + 1}`;
                    input.value = option;
                    input.id = `q${index + 1}option${optionIndex + 1}`;
                    input.addEventListener('change', () => checkAnswer(`q${index + 1}`, option, q.answer, questionContainer));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = option;

                    optionContainer.appendChild(input);
                    optionContainer.appendChild(label);

                    questionContainer.appendChild(optionContainer);
                });

                const correctAnswerDiv = document.createElement('div');
                correctAnswerDiv.className = 'correct-answer';
                correctAnswerDiv.id = `q${index + 1}-correct-answer`;
                correctAnswerDiv.textContent = `Correct answer: ${q.answer}`;
                questionContainer.appendChild(correctAnswerDiv);

                form.appendChild(questionContainer);
            });
        }

        function checkAnswer(question, selectedOption, correctAnswer, questionContainer) {
            const options = document.getElementsByName(question);
            const correctAnswerDiv = document.getElementById(`${question}-correct-answer`);
            correctAnswerDiv.style.display = 'none';

            options.forEach(option => {
                const label = option.nextElementSibling;
                label.classList.remove('correct', 'incorrect');
                if (option.checked) {
                    if (option.value === correctAnswer) {
                        label.classList.add('correct');
                    } else {
                        label.classList.add('incorrect');
                        correctAnswerDiv.style.display = 'block';
                    }
                }
            });
        }

        loadQuestions();
    </script>
</body>
</html>
