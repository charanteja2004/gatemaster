# Local development: a Postgres and the server against it.
#
#   docker compose -f server/docker-compose.yml up --build
#
# The test suite does not need this -- it runs on H2 in memory. This is for
# exercising the API against the database it will actually be deployed on,
# which is the only way to catch anything outside the portable SQL subset.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gatemaster
      POSTGRES_USER: gatemaster
      POSTGRES_PASSWORD: local-development-only
    ports:
      # Published so psql and a JDBC client on the host can reach it. The
      # server below talks to it over the compose network instead.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatemaster -d gatemaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # The whole repository, because the build stage needs the Gradle wrapper
      # and the version catalog, which live above server/.
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      db:
        # Not just "started": the server migrates on boot, and a Postgres that
        # has not finished initialising will refuse the connection.
        condition: service_healthy
    environment:
      PORT: 8080
      GATEMASTER_DATABASE_URL: jdbc:postgresql://db:5432/gatemaster
      GATEMASTER_DATABASE_USER: gatemaster
      GATEMASTER_DATABASE_PASSWORD: local-development-only
      # Local only, and it is in a committed file, so treat it as public. A
      # deployed instance reads this from a secret.
      GATEMASTER_JWT_SECRET: local-development-secret-not-for-any-real-deployment
      # The floor. Signing in during development should not take a full second.
      GATEMASTER_BCRYPT_COST: 10
    ports:
      - "8080:8080"

volumes:
  pgdata:
